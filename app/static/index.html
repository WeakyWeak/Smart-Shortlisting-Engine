<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Shortlisting Engine</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/htm/3.1.1/htm.js"></script>
<style>
:root{--bg:#0f1117;--panel:#171a23;--panel2:#1e222d;--line:#2a2f3d;--tx:#e6e9ef;--dim:#8b93a7;
--acc:#5b8cff;--good:#3fb950;--warn:#d29922;--bad:#f85149;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:650}
.sub{color:var(--dim);font-size:13px}
.wrap{display:grid;grid-template-columns:1fr 380px;gap:20px;padding:20px 24px;align-items:start}
@media(max-width:1100px){.wrap{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card h2{font-size:13px;margin:0;padding:12px 16px;border-bottom:1px solid var(--line);
color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 12px;color:var(--dim);font-weight:600;font-size:11px;
text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid #20242f;vertical-align:middle}
tr.row{cursor:pointer}tr.row:hover td{background:#1b1f2a}
tr.open td{background:#1b2030}
.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.score{font-family:var(--mono);font-weight:700}
.bar{height:5px;border-radius:3px;background:#262b38;position:relative;min-width:56px;margin-top:3px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:3px;display:block}
.pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;
background:#232839;color:var(--dim);white-space:nowrap}
.delta{font-family:var(--mono);font-weight:600}
.up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--dim)}
.detail{padding:14px 16px;background:#12151d}
.ev{border-left:2px solid var(--line);padding:7px 0 7px 11px;margin:7px 0}
.ev.hit{border-color:var(--good)}.ev.sem{border-color:var(--acc)}.ev.miss{border-color:var(--bad);opacity:.75}
.ev .q{color:var(--dim);font-style:italic;margin-top:3px;font-size:12.5px}
.tag{font-size:10.5px;padding:1px 6px;border-radius:4px;margin-right:6px;font-weight:600}
.t-both{background:#16341f;color:var(--good)}.t-sem{background:#152540;color:var(--acc)}
.t-kw{background:#3a2f12;color:var(--warn)}.t-miss{background:#3a1a1a;color:var(--bad)}
.exp{padding:13px 16px;border-bottom:1px solid var(--line)}
.exp:last-child{border:0}
.exp .who{font-weight:650;margin-bottom:5px;display:flex;justify-content:space-between;gap:8px}
.flag{padding:11px 16px;border-bottom:1px solid var(--line);font-size:12.5px}
.flag:last-child{border:0}
.sev{font-size:10px;padding:1px 6px;border-radius:4px;font-weight:700;text-transform:uppercase}
.s-high{background:#3a1a1a;color:var(--bad)}.s-medium{background:#3a2f12;color:var(--warn)}
.s-low{background:#232839;color:var(--dim)}
.chat{display:flex;flex-direction:column;height:390px}
.log{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.msg{padding:8px 11px;border-radius:9px;max-width:92%;font-size:13px;white-space:pre-wrap}
.me{background:var(--acc);color:#fff;align-self:flex-end}
.bot{background:var(--panel2);align-self:flex-start}
.ask{display:flex;gap:7px;padding:11px;border-top:1px solid var(--line)}
input,button{font:inherit}
input{flex:1;background:#0c0e14;border:1px solid var(--line);color:var(--tx);
padding:8px 11px;border-radius:7px;outline:none}
input:focus{border-color:var(--acc)}
button{background:var(--acc);color:#fff;border:0;padding:8px 15px;border-radius:7px;
cursor:pointer;font-weight:600}
button:disabled{opacity:.5;cursor:default}
.sug{display:flex;flex-wrap:wrap;gap:5px;padding:0 14px 11px}
.sug span{font-size:11.5px;padding:3px 9px;background:var(--panel2);border:1px solid var(--line);
border-radius:20px;cursor:pointer;color:var(--dim)}
.sug span:hover{border-color:var(--acc);color:var(--tx)}
.legend{padding:10px 16px;color:var(--dim);font-size:12px;line-height:1.7;border-top:1px solid var(--line)}
code{font-family:var(--mono);background:#0c0e14;padding:1px 5px;border-radius:4px;font-size:12px}
.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--dim);font-size:12px}
.meta b{color:var(--tx);font-weight:600;font-family:var(--mono)}
</style>
</head>
<body>
<div id="root"></div>
<script>
const html = htm.bind(React.createElement);
const {useState, useEffect, useRef} = React;
const api = (p,o) => fetch(p,o).then(r=>r.json());
const col = s => s>=55?'var(--good)':s>=35?'var(--warn)':'var(--bad)';

function Bar({v,max=100,c}){
  return html`<div class="bar"><i style=${{width:Math.max(2,100*v/max)+'%',background:c}}></i></div>`;
}

function Evidence({e}){
  const cls = e.hard_miss||!e.matched ? 'miss' : (e.kw_hit>0 ? 'hit' : 'sem');
  const tag = !e.matched ? ['t-miss', e.required?'no evidence (required)':'no evidence']
            : e.kw_hit>0 && e.semantic>=0.55 ? ['t-both','both channels']
            : e.kw_hit>0 ? ['t-kw','keyword'] : ['t-sem','semantic only'];
  return html`<div class=${'ev '+cls}>
    <div><span class=${'tag '+tag[0]}>${tag[1]}</span>${e.requirement}</div>
    ${e.matched && e.evidence && html`<div class="q">"${e.evidence}"</div>`}
    <div class="q" style=${{fontStyle:'normal',fontSize:'11.5px',marginTop:'4px'}}>
      kw ${e.kw_hit.toFixed(2)}${e.kw_terms.length?' ('+e.kw_terms.join(', ')+')':''}
      · sem ${e.semantic.toFixed(2)}${e.cross_encoder!=null?' · cross-enc '+e.cross_encoder.toFixed(2):''}
    </div></div>`;
}

function Row({c,open,onClick}){
  const [full,setFull] = useState(null);
  useEffect(()=>{ if(open && !full) api('/api/candidate/'+encodeURIComponent(c.stem)).then(setFull); },[open]);
  const d = c.delta;
  return html`<${React.Fragment}>
    <tr class=${'row'+(open?' open':'')} onClick=${onClick}>
      <td class="num">${c.rank}</td>
      <td>${c.name}<div style=${{color:'var(--dim)',fontSize:'11.5px'}}>${c.family}</div></td>
      <td class="num"><span class="score" style=${{color:col(c.final_score)}}>${c.final_score.toFixed(1)}</span>
        <${Bar} v=${c.final_score} c=${col(c.final_score)}/></td>
      <td class="num">${c.keyword_score.toFixed(1)}<${Bar} v=${c.keyword_score} c="var(--warn)"/></td>
      <td class="num">${c.semantic_score.toFixed(1)}<${Bar} v=${c.semantic_score} c="var(--acc)"/></td>
      <td class=${'delta '+(d>8?'up':d<-8?'down':'flat')}>${d>0?'+':''}${d.toFixed(1)}</td>
      <td class="num">${c.required_coverage}</td>
      <td><span class="pill">${c.formats_available.join(' ')}</span></td>
    </tr>
    ${open && html`<tr><td colspan="8" class="detail">
      ${!full ? html`<div style=${{color:'var(--dim)'}}>loading evidence…</div>` : html`<${React.Fragment}>
        <div class="meta" style=${{marginBottom:'10px'}}>
          <span>BM25 <b>${full.bm25}</b></span><span>hard misses <b>${full.hard_misses}</b></span>
          <span>parsed from <b>.${full.source_format}</b></span>
          <span>re-ranked <b>${full.reranked?'yes':'no'}</b></span>
          ${full.email && html`<span><b>${full.email}</b></span>`}</div>
        ${full.explanation && html`<div style=${{marginBottom:'10px',padding:'9px 11px',
          background:'var(--panel2)',borderRadius:'7px'}}>${full.explanation}</div>`}
        ${full.evidence.filter(e=>e.required).map(e=>html`<${Evidence} key=${e.id} e=${e}/>`)}
      <//>`}
    </td></tr>`}
  <//>`;
}

function Chat(){
  const [log,setLog] = useState([]);
  const [q,setQ] = useState(''); const [busy,setBusy] = useState(false);
  const end = useRef();
  useEffect(()=>end.current?.scrollIntoView({behavior:'smooth'}),[log]);
  const send = async (text) => {
    const question = (text ?? q).trim(); if(!question||busy) return;
    setLog(l=>[...l,{me:1,t:question}]); setQ(''); setBusy(true);
    try{
      const r = await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({question})});
      setLog(l=>[...l,{t:r.answer,src:r.source}]);
    }catch(e){ setLog(l=>[...l,{t:'request failed: '+e.message}]); }
    setBusy(false);
  };
  return html`<div class="card"><h2>Recruiter chat</h2><div class="chat">
    <div class="log">
      ${log.length===0 && html`<div style=${{color:'var(--dim)',fontSize:'12.5px'}}>
        Ask about the ranking. Answers are generated only from the engine's verified
        per-requirement facts — never from raw resume text.</div>`}
      ${log.map((m,i)=>html`<div key=${i} class=${'msg '+(m.me?'me':'bot')}>${m.t}
        ${m.src==='template' && html`<div style=${{fontSize:'10.5px',opacity:.65,marginTop:'4px'}}>
          offline fallback (no LLM)</div>`}</div>`)}
      ${busy && html`<div class="msg bot" style=${{opacity:.6}}>thinking…</div>`}
      <div ref=${end}></div>
    </div>
    <div class="sug">${['Why is #1 ranked above #3?','Who has the strongest Node.js evidence?',
      'Which top candidates are missing PostgreSQL?'].map(s=>
      html`<span key=${s} onClick=${()=>send(s)}>${s}</span>`)}</div>
    <div class="ask">
      <input value=${q} placeholder="Ask about any candidate…" onChange=${e=>setQ(e.target.value)}
        onKeyDown=${e=>e.key==='Enter'&&send()}/>
      <button disabled=${busy} onClick=${()=>send()}>Ask</button></div>
  </div></div>`;
}

function App(){
  const [d,setD] = useState(null); const [open,setOpen] = useState(null); const [n,setN] = useState(18);
  useEffect(()=>{api('/api/ranking').then(setD)},[]);
  if(!d) return html`<div style=${{padding:'40px',color:'var(--dim)'}}>ranking candidates…</div>`;
  const cs = d.candidates.slice(0,n);
  const scores = d.candidates.map(c=>c.final_score);
  const spread = (Math.max(...scores)-Math.min(...scores)).toFixed(1);
  return html`<${React.Fragment}>
    <header>
      <h1>${d.job.title}</h1><span class="sub">${d.job.company}</span>
      <span class="sub">· ${d.count} candidates · ${d.job.requirements.length} requirements
      (${d.job.requirements.filter(r=>r.required).length} required) · score spread ${spread}</span>
      <span class="sub" style=${{marginLeft:'auto'}}>
        <code>${d.config.bi_encoder}</code> + <code>${d.config.cross_encoder}</code></span>
    </header>
    <div class="wrap">
      <div class="card">
        <h2>Ranked shortlist — click any row for per-requirement evidence</h2>
        <table><thead><tr>
          <th>#</th><th>Candidate</th><th style=${{textAlign:'right'}}>Score</th>
          <th style=${{textAlign:'right'}}>Keyword</th><th style=${{textAlign:'right'}}>Semantic</th>
          <th>Δ</th><th style=${{textAlign:'right'}}>Req</th><th>Formats</th>
        </tr></thead><tbody>
          ${cs.map(c=>html`<${Row} key=${c.stem} c=${c} open=${open===c.stem}
            onClick=${()=>setOpen(open===c.stem?null:c.stem)}/>`)}
        </tbody></table>
        <div class="legend">
          <b>Δ = semantic − keyword.</b> Strongly positive means the candidate proves the
          requirement through related work without naming the exact tool — the case pure
          keyword search misses. Strongly negative means they name the tools but show
          thinner supporting evidence. Both channels are computed independently and both
          feed the final score (<code>${d.config.w_keyword} × keyword + ${d.config.w_semantic} × semantic</code>,
          scaled down per unmet required criterion).
        </div>
        ${n<d.count && html`<div style=${{padding:'11px 16px'}}>
          <button onClick=${()=>setN(n+30)}>Show more (${d.count-n} remaining)</button></div>`}
      </div>
      <div style=${{display:'flex',flexDirection:'column',gap:'20px'}}>
        <div class="card"><h2>Top 3 — why they rank here</h2>
          ${d.candidates.slice(0,3).map(c=>html`<div class="exp" key=${c.stem}>
            <div class="who"><span>#${c.rank} ${c.name}</span>
              <span class="score" style=${{color:col(c.final_score)}}>${c.final_score.toFixed(1)}</span></div>
            <div style=${{fontSize:'12.5px'}}>${c.explanation||'—'}</div>
            <div style=${{color:'var(--dim)',fontSize:'11px',marginTop:'6px'}}>
              ${c.required_coverage} required covered · ${c.explanation_source}</div>
          </div>`)}
        </div>
        <${Chat}/>
        <div class="card"><h2>JD bias audit — ${d.bias.flags} finding(s)</h2>
          ${d.bias.findings.length===0 && html`<div class="flag">No issues found.</div>`}
          ${d.bias.findings.map((f,i)=>html`<div class="flag" key=${i}>
            <div><span class=${'sev s-'+f.severity}>${f.severity}</span>
              <b style=${{marginLeft:'7px'}}>${f.term||f.type}</b></div>
            <div style=${{color:'var(--dim)',marginTop:'4px'}}>${f.why}</div>
            <div style=${{marginTop:'4px'}}>→ ${f.suggestion}</div>
          </div>`)}
        </div>
      </div>
    </div>
  <//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
